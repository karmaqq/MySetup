[build]
  command = "node build.web.mjs"
  publish = "."

[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/js/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/css/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/opencode/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.env*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/js/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/css/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/opencode/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
